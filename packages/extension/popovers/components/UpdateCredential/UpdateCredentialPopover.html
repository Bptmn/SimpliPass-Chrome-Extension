<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliPass - Update Credential</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
        }
        
        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { UpdateCredentialPopover } from './UpdateCredentialPopover.tsx';
        
        // Initialize the popover
        const root = createRoot(document.getElementById('root'));
        
        // Handle messages from parent
        window.addEventListener('message', (event) => {
            if (event.data.type === 'SHOW_UPDATE_CREDENTIAL') {
                const { capturedData, existingCredential } = event.data;
                
                root.render(
                    React.createElement(UpdateCredentialPopover, {
                        capturedData,
                        existingCredential,
                        onUpdate: async (credential) => {
                            // Send update request to parent
                            window.parent.postMessage({
                                type: 'UPDATE_CREDENTIAL_REQUEST',
                                credential
                            }, '*');
                        },
                        onKeepExisting: () => {
                            // Send keep existing event to parent
                            window.parent.postMessage({
                                type: 'KEEP_EXISTING_CREDENTIAL'
                            }, '*');
                        },
                        onDismiss: () => {
                            // Send dismiss event to parent
                            window.parent.postMessage({
                                type: 'UPDATE_CREDENTIAL_DISMISS'
                            }, '*');
                        }
                    })
                );
            }
        });
        
        // Notify parent that popover is ready
        window.parent.postMessage({
            type: 'UPDATE_CREDENTIAL_READY'
        }, '*');
    </script>
</body>
</html>
