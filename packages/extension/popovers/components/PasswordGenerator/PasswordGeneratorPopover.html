<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpliPass - Générateur de mot de passe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
        }
        
        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { PasswordGeneratorPopover } from './PasswordGeneratorPopover.tsx';
        
        // Initialize the popover
        const root = createRoot(document.getElementById('root'));
        
        // Handle messages from parent
        window.addEventListener('message', (event) => {
            if (event.data.type === 'SHOW_PASSWORD_GENERATOR') {
                const { initialOptions } = event.data;
                
                root.render(
                    React.createElement(PasswordGeneratorPopover, {
                        onAccept: (password) => {
                            // Send password back to parent
                            window.parent.postMessage({
                                type: 'PASSWORD_GENERATOR_ACCEPT',
                                password
                            }, '*');
                        },
                        onRegenerate: () => {
                            // Send regenerate event to parent
                            window.parent.postMessage({
                                type: 'PASSWORD_GENERATOR_REGENERATE'
                            }, '*');
                        },
                        onCancel: () => {
                            // Send cancel event to parent
                            window.parent.postMessage({
                                type: 'PASSWORD_GENERATOR_CANCEL'
                            }, '*');
                        },
                        initialOptions
                    })
                );
            }
        });
        
        // Notify parent that popover is ready
        window.parent.postMessage({
            type: 'PASSWORD_GENERATOR_READY'
        }, '*');
    </script>
</body>
</html>
